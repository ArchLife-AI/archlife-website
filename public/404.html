<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found | ArchLife</title>
  <meta name="description" content="The requested ArchLife page could not be found.">
  <meta name="robots" content="noindex, nofollow">
  <style>
    body {
      background-color: #0D0F12;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
      box-sizing: border-box;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 800px;
      margin: 0 auto;
    }
    .eyebrow {
      color: #C88B5A;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    h1 {
      color: #F3EFE7;
      font-size: 2.5rem;
      font-weight: 300;
      margin-bottom: 1.5rem;
      font-family: "Cormorant Garamond", Georgia, serif;
    }
    p {
      color: #9CA3AF;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2.5rem;
      max-width: 500px;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
      align-items: center;
    }
    .links a:first-child {
      color: #C88B5A;
      text-decoration: none;
      font-size: 0.9rem;
      border-bottom: 1px solid #C88B5A;
      padding-bottom: 0.2rem;
    }
    .links a:last-child {
      color: #9CA3AF;
      text-decoration: none;
      font-size: 0.9rem;
      border-bottom: 1px solid rgba(156, 163, 175, 0.4);
      padding-bottom: 0.2rem;
    }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">404</span>
    <h1>This route does not exist.</h1>
    <p>The page may have moved, or the address may be incomplete. Return to ArchLife or begin a conversation with the team.</p>
    <div class="links">
      <a href="/">Return home</a>
      <a href="/contact">Contact ArchLife</a>
    </div>
  </main>
</body>
</html>
